<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGX Campaign Sprinter</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header style="background: #0d1728; padding: 15px 30px; border-bottom: 1px solid #1a2638;">
        <h2 style="margin: 0; color: #037ef3;">OGX CAMPAIGN SPRINTER</h2>
        <small style="color: #a0aec0;">AIESEC in CINEC</small>
    </header>

    <div class="dashboard-container">
        
        <!-- Campaign Progress -->
        <section style="background: #0d1728; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
            <h3 style="margin-top: 0;">CAMPAIGN PROGRESS</h3>
            <p>Day 13 of 30 &nbsp;•&nbsp; <span style="color: #037ef3;">17 days left</span></p>
            <div style="background: #1a2638; width: 100%; height: 12px; border-radius: 6px; overflow: hidden;">
                <div style="background: #037ef3; width: 43%; height: 100%;"></div>
            </div>
        </section>

        <!-- Stats Grid -->
        <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
            <div style="background: #0d1728; padding: 15px; border-radius: 8px;">
                <small style="color: #a0aec0;">TEAMS</small>
                <h2 style="margin: 5px 0 0 0;">7</h2>
            </div>
            <div style="background: #0d1728; padding: 15px; border-radius: 8px;">
                <small style="color: #a0aec0;">MEMBERS</small>
                <h2 style="margin: 5px 0 0 0;">34</h2>
            </div>
            <div style="background: #0d1728; padding: 15px; border-radius: 8px;">
                <small style="color: #a0aec0;">LEADING TEAM</small>
                <h2 style="margin: 5px 0 0 0; color: #ffd700;">VENGEANCE</h2>
            </div>
        </section>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
